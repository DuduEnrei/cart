
<div id="root">



<h2>Shopping Cart</h2>



<div class="product-list" v-if="!completeCheckout">
    <h2>Products</h2>
    <div v-for="(product,index) in products" :key="index">
        <h3>{{product.name}} | Price:${{product.price}}</h3>
        <button @click="addToCart(product)">Add to Cart</button>
    </div>
</div>

<div class="product-cart" v-if="!completeCheckout">
    <h2>Cart</h2>
    <p class="product-card" v-if="cart.length ==0">Add items</p>
    <div v-else>
        <div class="cart-item" v-for="(item,index) in cart" :key="index">
            <p>Price${{item.price}} | Name: {{item.name}}</p>
            <button @click="decreaseQty(index)"> - </button>
            {{item.quantity}}
            <button @click="increaseQty(index)"> + </button>
            <button @click="removeItem(index)">REMOVE</button>
        </div>
        <h3>Total: ${{cartTotal}}</h3>
        <button @click="Checkout">checkout</button>
        <button @click="clearCart">Clear Cart</button>

    </div>
    
</div>
<div v-if="completeCheckout==true">

    <h1>Thank You For Buying Stuff</h1>
    <h2>Please Pay $ {{cartTotal}} </h2>
    <button>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeOwlfBSQ27UEiq09eccNy65XVj5HuyALiy6W5lj5Lrw&s=10">
    </button>
</div>
<script src="../vue2.js"></script>
<script>
    new Vue({
        el:"#root",
        data:{
            products:[
                {name: "liver",price:27},
                {name: "intestine",price:37},
                {name: "gut",price:29},
                {name: "skin",price:10},
                {name: "brain",price:99},
            ],
            cart:[],
            completeCheckout:false,
        },
        methods:{
            addToCart(product){
                let existing=this.cart.find(item=> item.name==product.name)
                if(existing){
                    existing.quantity++;
                } else{
                    this.cart.push({
                        name:product.name,
                        price:product.price,
                        quantity: 1,
                    });
                }
            },
            decreaseQty(index){
                if(this.cart[index].quantity>1){
                    this.cart[index].quantity--;
                }
            },
            increaseQty(index){
                this.cart[index].quantity++;
            },
            removeItem(index){
                this.cart.splice(index,1);
            },
            clearCart(){
                this.cart=[]
            },

            Checkout(){
                this.completeCheckout = true;
            }
        },
        computed:{
            cartTotal(){
                let total=0;
                this.cart.forEach(item => {
                    total=total+(item.price*item.quantity);
                });
                return total.toFixed(2);
            },
            totalPrice(){
                let total=0;
                this.cart.forEach(item=> total +=item.price * item.quantity);
                return total.toFixed(2);
            }
        },
    })
</script>
